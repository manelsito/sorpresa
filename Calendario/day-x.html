<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Día X — Adivinanzas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #c22b2b;
    --green: #1f7a3a;
    --accent: #f7f7f7;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', system-ui, sans-serif;
    background: linear-gradient(180deg, #04121a 0%, #071828 60%);
    color: var(--accent);
  }

  .contenido {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 40px 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 700px;
    width: 90%;
  }

  h1 {
    margin-top: 0;
    font-size: 32px;
    background: linear-gradient(90deg, var(--red), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }

  p {
    font-size: 18px;
    color: rgba(255,255,255,0.8);
    white-space: pre-line;
  }

  input {
    margin-top: 20px;
    padding: 14px;
    width: 80%;
    max-width: 320px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: var(--accent);
    font-size: 16px;
    text-align: center;
  }

  button {
    margin-top: 20px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 16px;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  button:hover {
    background: rgba(255,255,255,0.25);
  }

  .error {
    margin-top: 15px;
    color: var(--red);
    font-size: 15px;
  }
</style>
</head>

<body>
  <div class="contenido">
    <h1 id="titulo">Adivinanza 1</h1>
    <p id="texto">TEXTO DE LA ADIVINANZA 1</p>

    <input id="respuesta" type="text" placeholder="Escribe tu respuesta" />
    <br>
    <button onclick="comprobar()">Comprobar</button>

    <div class="error" id="error"></div>
  </div>

<script>
const adivinanzas = [
  { texto: "De cada cual según su capacidad, a cada cual según su necesidad. PagX", solucion: "452339" },
  { texto: "ADIVINANZA 2", solucion: "RESPUESTA2" },
  { texto: "ADIVINANZA 3", solucion: "RESPUESTA3" },
  { texto: "ADIVINANZA 4", solucion: "RESPUESTA4" },
  { texto: "ADIVINANZA 5", solucion: "RESPUESTA5" }
];

let actual = 0;

const titulo = document.getElementById("titulo");
const texto = document.getElementById("texto");
const input = document.getElementById("respuesta");
const error = document.getElementById("error");

function cargar(){
  if(actual < adivinanzas.length){
    titulo.textContent = "Adivinanza " + (actual + 1);
    texto.textContent = adivinanzas[actual].texto;
    input.value = "";
    error.textContent = "";
  } else {
    titulo.textContent = "¡Final!";
    texto.textContent = "PANTALLA FINAL AQUÍ";
    input.style.display = "none";
    document.querySelector("button").style.display = "none";
  }
}

function comprobar(){
  const valor = input.value.trim().toLowerCase();
  const correcta = adivinanzas[actual].solucion.toLowerCase();

  if(valor === correcta){
    actual++;
    cargar();
  } else {
    error.textContent = "Respuesta incorrecta, inténtalo otra vez 💭";
  }
}

cargar();
</script>
</body>
</html>
