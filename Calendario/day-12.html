<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Día 12</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #08121a;
    --panel: #071017;
    --red: #c22b2b;
    --green: #1f7a3a;
    --gold: #d4a017;
    --accent: #f7f7f7;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', system-ui, sans-serif;
    background: linear-gradient(180deg, #04121a 0%, #071828 60%);
    color: var(--accent);
  }

  .contenido {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 40px 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 700px;
    width: 90%;
  }

  h1 {
    margin-top: 0;
    font-size: 32px;
    background: linear-gradient(90deg, var(--red), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }

  p {
    font-size: 18px;
    color: rgba(255,255,255,0.75);
  }

  .sopa {
    font-family: monospace;
    font-size: 22px;
    letter-spacing: 6px;
    line-height: 32px;
    margin: 25px auto;
    white-space: pre;
    color: var(--accent);
  }

  .lista {
    margin-top: 20px;
    font-size: 18px;
  }
</style>
</head>

<body>
  <div class="contenido">
    <h1>Día 11: SOPA DE LETRASSSSS</h1>
    <p>Encuentra las 4 palabras ocultas:</p>
    <div class="lista"><strong>GUAPITA — TEQUIERO — BODA — BESITO</strong></div>

    <div class="sopa" id="sopa"></div>

<script>
const words = ["GUAPITA","TEQUIERO","BODA","BESITO"];
const found = new Set();
const grid = [
  ["A","O","P","R","X","L","U","Z","P","Q"],
  ["Q","R","G","R","T","Y","U","I","O","B"],
  ["S","E","L","U","L","M","N","O","P","O"],
  ["P","I","S","D","A","G","H","J","K","D"],
  ["F","U","E","S","T","P","B","C","D","A"],
  ["R","Q","Y","U","I","O","I","L","M","N"],
  ["Z","E","C","V","B","N","M","T","R","S"],
  ["H","T","K","L","Z","X","C","V","A","N"],
  ["M","N","B","E","S","I","T","O","K","J"],
];

const cont = document.getElementById("sopa");
let selected = [];

function render(){
  cont.innerHTML = "";
  grid.forEach((row,r)=>{
    const div = document.createElement("div");
    row.forEach((letter,c)=>{
      const span = document.createElement("span");
      span.textContent = letter;
      span.style.cursor = "pointer";
      span.style.padding = "4px";
      span.dataset.r = r;
      span.dataset.c = c;
      span.onclick = ()=> toggleSelect(r,c,span);
      div.appendChild(span);
    });
    cont.appendChild(div);
  });
  addVictoryMsg();
}

function toggleSelect(r,c,el){
  const index = selected.findIndex(x=> x[0]===r && x[1]===c);
  if(index >= 0){
    selected.splice(index,1);
    el.style.background = "none";
  } else {
    selected.push([r,c]);
    el.style.background = "rgba(255,255,255,0.3)";
  }
  checkWord();
}

function checkWord(){
  const text = selected.map(([r,c])=> grid[r][c]).join("");
  for(const w of words){
    if(text.endsWith(w)){
      found.add(w);
      lockWord(w);
      selected = [];
    }
  }
  checkVictory();
}

function lockWord(word){
  // Keeps selected letters highlighted; no alert.
}

function checkVictory(){
  const msg = document.getElementById("victoria-msg");
  if(found.size === words.length){
    msg.textContent = "OleOlee. Cual quieres de las 4??? PD: recuerda que es el cumple de mi hermana :)";
  }
}

function addVictoryMsg(){
  let msg = document.getElementById("victoria-msg");
  if(!msg){
    msg = document.createElement("div");
    msg.id = "victoria-msg";
    msg.style.marginTop = "20px";
    msg.style.fontSize = "20px";
    msg.style.fontWeight = "600";
    msg.style.color = "var(--green)";
    cont.parentElement.appendChild(msg);
  }
}

render();
</script>
  </div>
</body>
</html>
