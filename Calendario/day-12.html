<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Día 12</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #08121a;
    --panel: #071017;
    --red: #c22b2b;
    --green: #1f7a3a;
    --gold: #d4a017;
    --accent: #f7f7f7;
  }

  body {
    margin: 0;
    height: 100vh;
    font-family: 'Montserrat', system-ui, sans-serif;
    background: linear-gradient(180deg, #04121a 0%, #071828 60%);
    color: var(--accent);
    overflow: hidden; /* Para evitar scroll al poner los videos */
    position: relative;
  }

  .contenido {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 40px 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 700px;
    width: 90%;
    margin: auto;
    margin-top: 20px;
  }

  h1 {
    margin-top: 0;
    font-size: 32px;
    background: linear-gradient(90deg, var(--red), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }

  p {
    font-size: 18px;
    color: rgba(255,255,255,0.75);
  }

  /* Estilo general de los videos */
  .video-random {
    position: absolute;
    width: 35vw;
    max-width: 180px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    z-index: 1; /* detrás del panel */
  }

  /* Posiciones aleatorias */
  #v1 { top: 5%; left: 5%; }
  #v2 { top: 60%; left: 10%; }
  #v3 { top: 20%; right: 5%; }
  #v4 { top: 75%; right: 12%; }
  #v5 { top: 15%; left: 10%; }
  #v6 { top: 50%; left: 70%; }

</style>
</head>

<body>

  <!-- MÚSICA DE FONDO (silenciada por defecto para permitir autoplay en móvil) -->
  <audio id="musica" src="../src/music/random.mp3" autoplay loop muted></audio>

  <script>
    // En el primer toque de pantalla, activamos el sonido.
    document.addEventListener("touchstart", function() {
      const audio = document.getElementById("musica");
      audio.muted = false;
      audio.volume = 1;
    }, { once: true });
  </script>

  <!-- VIDEOS ALEATORIOS -->
  <video id="v1" class="video-random" autoplay loop muted playsinline>
    <source src="../src/video/aceituna.mp4" type="video/mp4">
  </video>

  <video id="v2" class="video-random" autoplay loop muted playsinline>
    <source src="../src/video/cara.mp4" type="video/mp4">
  </video>

  <video id="v3" class="video-random" autoplay loop muted playsinline>
    <source src="../src/video/baile2.mp4" type="video/mp4">
  </video>

  <video id="v4" class="video-random" autoplay loop muted playsinline>
    <source src="../src/video/coleta.mp4" type="video/mp4">
  </video>

  <video id="v5" class="video-random" autoplay loop muted playsinline>
    <source src="../src/video/oumama.mp4" type="video/mp4">
  </video>

  <video id="v6" class="video-random" autoplay loop muted playsinline>
    <source src="../src/video/baile1.mp4" type="video/mp4">
  </video>

</body>
</html>
