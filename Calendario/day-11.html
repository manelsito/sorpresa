<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Día 11</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #08121a;
    --panel: #071017;
    --red: #c22b2b;
    --green: #1f7a3a;
    --gold: #d4a017;
    --accent: #f7f7f7;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', system-ui, sans-serif;
    background: linear-gradient(180deg, #04121a 0%, #071828 60%);
    color: var(--accent);
  }

  .contenido {
    display: grid;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.06);
    justify-content: center;
    padding: 40px 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 700px;
    width: 90%;
  }

  h1 {
    margin-top: 0;
    font-size: 32px;
    background: linear-gradient(90deg, var(--red), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }

  p {
    font-size: 18px;
    color: rgba(255,255,255,0.75);
  }

  img {
    max-width: 100%;
    height: 250px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    margin-top: 20px;
    display: none; /* La imagen comienza oculta */
  }

  #texto {
    display: none; /* El texto comienza oculto */
  }

  input {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    outline: none;
    margin-top: 15px;
    font-size: 16px;
  }

  button {
    margin-top: 12px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: var(--green);
    color: white;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }

  button:hover {
    background: #249047;
  }
</style>
</head>

<body>
  <div class="contenido">
    <h1>¿</h1>
    <p>1203</p>

    <input type="text" id="clave" placeholder="Escribe aquí...">
    <br>
    <button onclick="verificar()">Comprobar</button>
    <br>

    <p id="texto"><strong>PEPO</strong></p>
    <img id="imagen" src="../src/img/salariominimo.png" alt="Imagen del día">
  </div>

<script>
  function verificar() {
    const palabraCorrecta = "LEPRECHAUN"; // 🔹 Cambia aquí la palabra secreta
    const entrada = document.getElementById("clave").value.toLowerCase();
    const imagen = document.getElementById("imagen");
    const texto = document.getElementById("texto");

    if (entrada === palabraCorrecta.toLowerCase()) {
      imagen.style.display = "block";
      texto.style.display = "block";
    } else {
      imagen.style.display = "none";
      texto.style.display = "none";
    }
  }
</script>

</body>
</html>
